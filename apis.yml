name: Yummly
kind: company
description: Yummly is a recipe and food discovery platform (yummly.com) offering
  semantic and visual recipe search, personalized recommendations, shopping lists,
  and guided cooking. Founded in 2009 (Redwood City, CA), Yummly was acquired by
  Whirlpool Corporation in May 2017 and operated as a wholly owned subsidiary tied
  to Whirlpool's smart-kitchen strategy. Yummly historically ran a well-known public
  Recipe API (developer.yummly.com) exposing recipe search, recipe details, and
  metadata endpoints. That developer program was DEPRECATED - it stopped accepting
  new signups and was wound down (commonly cited end date of September 30, 2019),
  and the developer.yummly.com developer portal and api.yummly.com endpoints are no
  longer available. There is no public Yummly developer API accepting new
  registrations as of this cataloging (2026-07-03); the APIs below are documented as
  historical / modeled for archival and migration reference only.
